<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <radialGradient id="orbitBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#170E2E"/>
      <stop offset="65%" stop-color="#090814"/>
      <stop offset="100%" stop-color="#05050A"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FF2E93" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05050A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#orbitBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Telemetry -->
  <text x="42" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FFB84D" letter-spacing="3">ORBITAL MATRIX // ACTIVE VENTURES</text>
  <text x="1158" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#00F0FF" letter-spacing="2">5 NODES IN MOTION</text>

  <!-- Central 3D Orbital System -->
  <g transform="translate(600 164)">
    <circle r="130" fill="url(#coreGlow)"/>

    <!-- 3D Tilted Elliptical Orbits -->
    <ellipse rx="280" ry="74" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(-12)"/>
    <ellipse rx="360" ry="92" stroke="#FF2E93" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="8 8" transform="rotate(9)">
      <animateTransform attributeName="transform" type="rotate" from="9 0 0" to="369 0 0" dur="36s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="210" ry="52" stroke="#FFB84D" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="14 6" transform="rotate(20)">
      <animateTransform attributeName="transform" type="rotate" from="20 0 0" to="-340 0 0" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Central 3D Diamond Core -->
    <g filter="url(#glowOrb)">
      <polygon points="0,-38 34,0 0,38 -34,0" fill="#0B0B18" stroke="#00F0FF" stroke-width="2"/>
      <polygon points="0,-24 21,0 0,24 -21,0" fill="#00F0FF" fill-opacity="0.22" stroke="#FFB84D" stroke-width="1.2"/>
      <text y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="2">V</text>
    </g>

    <!-- Moving Satellites on Orbits -->
    <g transform="rotate(-12)">
      <circle r="6" fill="#00F0FF" filter="url(#glowOrb)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M -280,0 A 280,74 0 1,0 280,0 A 280,74 0 1,0 -280,0"/>
      </circle>
    </g>
    <g transform="rotate(9)">
      <circle r="6.5" fill="#FF2E93" filter="url(#glowOrb)">
        <animateMotion dur="10s" repeatCount="indefinite" path="M 360,0 A 360,92 0 1,1 -360,0 A 360,92 0 1,1 360,0"/>
      </circle>
    </g>
    <g transform="rotate(20)">
      <circle r="5" fill="#FFB84D" filter="url(#glowOrb)">
        <animateMotion dur="5.5s" repeatCount="indefinite" path="M -210,0 A 210,52 0 1,0 210,0 A 210,52 0 1,0 -210,0"/>
      </circle>
    </g>
  </g>

  <!-- Venture Telemetry Labels (Left & Right) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- Left Column -->
    <rect x="44" y="88" width="185" height="46" rx="8" fill="#0E0D1D" stroke="#00F0FF" stroke-opacity="0.45"/>
    <circle cx="62" cy="111" r="4" fill="#00F0FF"/>
    <text x="76" y="108" font-size="12" font-weight="700" fill="#F8FAFC">VINTVATE</text>
    <text x="76" y="124" font-size="10" fill="#00F0FF">DIGITAL STUDIO</text>

    <rect x="44" y="152" width="185" height="46" rx="8" fill="#0E0D1D" stroke="#FF2E93" stroke-opacity="0.45"/>
    <circle cx="62" cy="175" r="4" fill="#FF2E93"/>
    <text x="76" y="172" font-size="12" font-weight="700" fill="#F8FAFC">STACKHOUSE</text>
    <text x="76" y="188" font-size="10" fill="#FF2E93">BUILDER COMMUNITY</text>

    <rect x="44" y="216" width="185" height="46" rx="8" fill="#0E0D1D" stroke="#FFB84D" stroke-opacity="0.45"/>
    <circle cx="62" cy="239" r="4" fill="#FFB84D"/>
    <text x="76" y="236" font-size="12" font-weight="700" fill="#F8FAFC">MEOW</text>
    <text x="76" y="252" font-size="10" fill="#FFB84D">EVENTS &amp; RSVP</text>

    <!-- Right Column -->
    <rect x="971" y="114" width="185" height="46" rx="8" fill="#0E0D1D" stroke="#A855F7" stroke-opacity="0.45"/>
    <circle cx="989" cy="137" r="4" fill="#A855F7"/>
    <text x="1003" y="134" font-size="12" font-weight="700" fill="#F8FAFC">PIXEL PILGRIM</text>
    <text x="1003" y="150" font-size="10" fill="#C084FC">GAMING SOCIAL</text>

    <rect x="971" y="184" width="185" height="46" rx="8" fill="#0E0D1D" stroke="#00F0FF" stroke-opacity="0.45"/>
    <circle cx="989" cy="207" r="4" fill="#00F0FF"/>
    <text x="1003" y="204" font-size="12" font-weight="700" fill="#F8FAFC">AUTOBRIEF AI</text>
    <text x="1003" y="220" font-size="10" fill="#00F0FF">TEAM INTELLIGENCE</text>
  </g>

  <!-- Bottom Caption -->
  <text x="600" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B" letter-spacing="3.5">IDEAS IN ORBIT · PRODUCTS IN MOTION</text>
</svg>
