<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" fill="none">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1200" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="50%" stop-color="#110A22"/>
      <stop offset="100%" stop-color="#05050A"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FF2E93" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="14" fill="url(#footBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Animated Retro Waveforms -->
  <path d="M 0 68 Q 150 32 300 68 T 600 68 T 900 68 T 1200 68" stroke="url(#waveGrad1)" stroke-width="1.8" fill="none">
    <animate attributeName="d"
      values="M 0 68 Q 150 32 300 68 T 600 68 T 900 68 T 1200 68;
              M 0 68 Q 150 96 300 68 T 600 68 T 900 68 T 1200 68;
              M 0 68 Q 150 32 300 68 T 600 68 T 900 68 T 1200 68"
      dur="5s" repeatCount="indefinite"/>
  </path>

  <path d="M 0 72 Q 150 100 300 72 T 600 72 T 900 72 T 1200 72" stroke="url(#waveGrad2)" stroke-width="1.4" fill="none">
    <animate attributeName="d"
      values="M 0 72 Q 150 100 300 72 T 600 72 T 900 72 T 1200 72;
              M 0 72 Q 150 40 300 72 T 600 72 T 900 72 T 1200 72;
              M 0 72 Q 150 100 300 72 T 600 72 T 900 72 T 1200 72"
      dur="4.2s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E2E8F0" letter-spacing="4">DESIGNED WITH INTENTION · BUILT WITH CURIOSITY · SHIPPED WITH OWNERSHIP</text>
  <text x="600" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B" letter-spacing="3">EOF // VEDANT VYAS</text>
</svg>

